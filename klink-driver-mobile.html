<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>K-LINK ドライバー</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  font-weight: 300;
  letter-spacing: 0.02em;
  background: #f5f3ef;
  color: #333;
  min-height: 100vh;
  padding-bottom: 70px;
}

.header {
  background: #fff;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #e8e4de;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header .logo { font-size: 13px; font-weight: 600; color: #333; letter-spacing: 1px; }
.header .ref { font-size: 11px; color: #999; }

.alert {
  margin: 12px 16px 0;
  padding: 10px 14px;
  background: #fff5f0;
  border-left: 3px solid #c0392b;
  border-radius: 4px;
  font-size: 12px;
  color: #c0392b;
  font-weight: 400;
}

.card {
  margin: 12px 16px;
  background: #fff;
  border-radius: 8px;
  border: 1px solid #e8e4de;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 10px 14px;
  border-bottom: 1px solid #f5f3ef;
}
.row:last-child { border-bottom: none; }
.row .label {
  font-size: 11px;
  color: #999;
  min-width: 80px;
  flex-shrink: 0;
}
.row .value {
  font-size: 13px;
  color: #333;
  font-weight: 400;
  text-align: right;
  flex: 1;
}

.section-label {
  padding: 6px 14px;
  font-size: 10px;
  color: #999;
  background: #faf8f5;
  border-bottom: 1px solid #f0ece6;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.expense {
  margin: 12px 16px;
  background: #fff;
  border-radius: 8px;
  border: 1px solid #e8e4de;
  padding: 14px;
  display: flex;
  gap: 8px;
}
.expense .field {
  flex: 1;
  text-align: center;
}
.expense .field label {
  display: block;
  font-size: 10px;
  color: #999;
  margin-bottom: 4px;
}
.expense .field input {
  width: 100%;
  padding: 8px 4px;
  border: 1px solid #e0dbd4;
  border-radius: 6px;
  font-size: 13px;
  text-align: center;
  background: #fff;
  color: #333;
  outline: none;
  font-family: inherit;
}

.btn-submit {
  display: block;
  width: calc(100% - 32px);
  padding: 12px;
  margin: 12px 16px;
  background: #333;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}

.footer {
  margin: 12px 16px;
  background: #fff;
  border-radius: 8px;
  border: 1px solid #e8e4de;
  padding: 12px 14px;
}
.footer .f-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.footer .f-row:last-child { margin-bottom: 0; }
.footer .f-label { font-size: 10px; color: #999; }
.footer .f-value { font-size: 12px; color: #c0392b; font-weight: 400; }

.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  border-top: 1px solid #e8e4de;
  display: flex;
  height: 56px;
  z-index: 10;
}
.tab-bar .tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 10px;
  color: #999;
  text-decoration: none;
  cursor: pointer;
}
.tab-bar .tab.active { color: #333; }
.tab-bar .tab .tab-icon { font-size: 18px; }
</style>
</head>
<body>

<div class="header">
  <span class="logo">K-LINK</span>
  <span class="ref">2026.05.19（月）</span>
</div>

<div class="alert">VIPゲスト — 丁寧な対応をお願いします。</div>

<div class="card">
  <div class="row">
    <span class="label">お客様名前</span>
    <span class="value">Mr Jose Lopez</span>
  </div>
  <div class="row">
    <span class="label">お客様連絡先</span>
    <span class="value">—</span>
  </div>
  <div class="row">
    <span class="label">ガイドor斡旋員連絡先</span>
    <span class="value">—</span>
  </div>
  <div class="row">
    <span class="label">人数</span>
    <span class="value">4名</span>
  </div>
  <div class="row">
    <span class="label">荷物</span>
    <span class="value">スーツケース8個</span>
  </div>
  <div class="row">
    <span class="label">乗車指定時間</span>
    <span class="value">06:30</span>
  </div>
  <div class="row">
    <span class="label">乗車地</span>
    <span class="value">成田国際空港</span>
  </div>
  <div class="row">
    <span class="label">下車地</span>
    <span class="value">The Okura Tokyo<br>港区虎ノ門2-10-4</span>
  </div>
  <div class="row">
    <span class="label">便名</span>
    <span class="value">AM 58</span>
  </div>
  <div class="row">
    <span class="label">便の時間</span>
    <span class="value">06:30着</span>
  </div>
  <div class="row">
    <span class="label">ミート</span>
    <span class="value">あり</span>
  </div>
  <div class="row">
    <span class="label">言語指定</span>
    <span class="value">—</span>
  </div>
  <div class="row">
    <span class="label">備考欄</span>
    <span class="value">フライトAM 58で06:30到着。</span>
  </div>
  <div class="row">
    <span class="label">プラン内容</span>
    <span class="value">空港送迎</span>
  </div>
</div>

<div class="footer">
  <div class="f-row">
    <span class="f-label">緊急連絡先</span>
    <span class="f-value">ジップトリップ細川様 090-8790-0822</span>
  </div>
  <div class="f-row">
    <span class="f-label">関連送迎</span>
    <span class="f-value" style="color:#333;">5/19 空港送迎 ／ 6/2 空港送迎</span>
  </div>
</div>

<div class="expense">
  <div class="field">
    <label>高速代</label>
    <input type="number" value="0">
  </div>
  <div class="field">
    <label>駐車場代</label>
    <input type="number" value="0">
  </div>
  <div class="field">
    <label>立替料金</label>
    <input type="number" value="0">
  </div>
</div>

<button class="btn-submit">保存</button>

<div class="tab-bar">
  <div class="tab"><span class="tab-icon">⏱</span><span>打刻</span></div>
  <div class="tab active"><span class="tab-icon">📋</span><span>日程</span></div>
  <div class="tab"><span class="tab-icon">👤</span><span>個人</span></div>
</div>

</body>
</html>
