<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>K-LINK ドライバー画面</title>
<style>
body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: flex-start; gap: 40px; padding: 40px; min-height: 100vh; }
.phone { width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 8px solid #333; background: #fff; }
.phone iframe { width: 100%; height: 100%; border: none; }
.label { color: #999; font-family: sans-serif; font-size: 13px; text-align: center; margin-bottom: 12px; }
.col { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
<div class="col">
  <div class="label">接送機</div>
  <div class="phone"><iframe src="klink-driver-mobile.html"></iframe></div>
</div>
<div class="col">
  <div class="label">貸切</div>
  <div class="phone"><iframe src="klink-driver-charter-mobile.html"></iframe></div>
</div>
</body>
</html>
