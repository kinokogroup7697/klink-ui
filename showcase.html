<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-LINK UI設計</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
  background: #f5f3ef;
  color: #333;
  padding: 40px 20px;
}
h1 {
  text-align: center;
  font-size: 20px;
  font-weight: 500;
  margin-bottom: 8px;
  letter-spacing: 2px;
}
.subtitle {
  text-align: center;
  font-size: 13px;
  color: #999;
  margin-bottom: 40px;
}
.section {
  margin-bottom: 60px;
}
.section-title {
  font-size: 14px;
  font-weight: 500;
  color: #333;
  margin-bottom: 16px;
  padding-left: 12px;
  border-left: 3px solid #333;
}
.frame-pc {
  width: 100%;
  height: 800px;
  border: 1px solid #e0dbd4;
  border-radius: 8px;
  background: #fff;
}
.frame-mobile {
  width: 390px;
  height: 844px;
  border: 1px solid #e0dbd4;
  border-radius: 20px;
  background: #fff;
  margin: 0 auto;
  display: block;
}
@media (max-width: 600px) {
  .frame-mobile { width: 100%; height: 700px; }
  .frame-pc { height: 500px; }
}
</style>
</head>
<body>

<h1>K-LINK 配車システム</h1>
<p class="subtitle">UI設計 — 2026.05</p>

<div class="section">
  <div class="section-title">接送機 — PC管理端</div>
  <iframe class="frame-pc" src="klink-new-reservation.html" frameborder="0"></iframe>
</div>

<div class="section">
  <div class="section-title">接送機 — ドライバー手機端</div>
  <iframe class="frame-mobile" src="klink-driver-mobile.html" frameborder="0"></iframe>
</div>

<div class="section">
  <div class="section-title">貸切 — PC管理端</div>
  <iframe class="frame-pc" src="klink-charter.html" frameborder="0"></iframe>
</div>

<div class="section">
  <div class="section-title">貸切 — ドライバー手機端</div>
  <iframe class="frame-mobile" src="klink-driver-charter-mobile.html" frameborder="0"></iframe>
</div>

</body>
</html>
